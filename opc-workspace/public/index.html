function createWorkspaceStorage(nativeStorage){
 const KEY="opc.workspace.v1",SUP="opc.supply.v1",OPS="opc.operations.v1";
 function read(){
  const raw=nativeStorage.getItem(KEY);
  if(raw){const e=JSON.parse(raw);if(!e||e.version!==1||!["string","object"].includes(typeof e.supplyRaw)||!["string","object"].includes(typeof e.opsRaw)||(typeof e.supplyRaw==="object"&&e.supplyRaw!==null)||(typeof e.opsRaw==="object"&&e.opsRaw!==null))throw Error("统一档案格式异常，请先备份原始浏览器数据");return e;}
  return {version:1,supplyRaw:nativeStorage.getItem(SUP),opsRaw:nativeStorage.getItem(OPS)};
 }
 return {
  getItem:function(k){if(k===SUP||k===OPS){const e=read();return k===SUP?e.supplyRaw:e.opsRaw;}return nativeStorage.getItem(k);},
  setItem:function(k,v){if(k===SUP||k===OPS){const e=read();e[k===SUP?"supplyRaw":"opsRaw"]=String(v);nativeStorage.setItem(KEY,JSON.stringify(e));}else nativeStorage.setItem(k,v);},
  removeItem:function(k){if(k===SUP||k===OPS){const e=read();e[k===SUP?"supplyRaw":"opsRaw"]=null;nativeStorage.setItem(KEY,JSON.stringify(e));}else nativeStorage.removeItem(k);},
  commitBoth:function(supplyRevision,opsRevision,supply,ops){const e=read(),s=e.supplyRaw?JSON.parse(e.supplyRaw):{revision:0},o=e.opsRaw?JSON.parse(e.opsRaw):{revision:0};if(s.revision!==supplyRevision||o.revision!==opsRevision)throw Error("另一窗口已更新档案，请刷新后重试");nativeStorage.setItem(KEY,JSON.stringify({version:1,supplyRaw:JSON.stringify(supply),opsRaw:JSON.stringify(ops)}));},
  rawBackup:function(){return nativeStorage.getItem(KEY)||JSON.stringify(read());}
 };
}
function availableWorkspaceStorage(){
 try{return createWorkspaceStorage(window.localStorage);}catch(e){const failure=function(){throw Error("浏览器未允许本地存储："+e.message);};return {getItem:failure,setItem:failure,removeItem:failure,commitBoth:failure,rawBackup:failure};}
}

const SUPPLY_KEY="opc.supply.v1";
const SUPPLY_FIELDS={
suppliers:["id","businessId","name","type","creditCode","country","address","contact","phone","messenger","email","website","products","currency","paymentTerms","status","verifiedAt","documents","notes","createdAt","updatedAt"],
factories:["id","businessId","name","country","address","contact","phone","process","capacity","products","certificates","inspection","status","documents","notes","createdAt","updatedAt"],
links:["id","supplierId","factoryId","type","status","proof","startDate","endDate","notes","createdAt","updatedAt"]
};
const BUSINESS_IDS=["BUS-001","BUS-002","BUS-003","BUS-004"];
const PARTY_STATUSES=["待核实","可合作","暂停","归档"];
const SUPPLIER_TYPES=["工厂直供","贸易商","代理商","服务商","待核实"];
const LINK_STATUSES=["待核实","已核实","已终止"];
function emptySupply(){return {schemaVersion:1,revision:0,suppliers:[],factories:[],links:[],logs:[]};}
function normalizeName(v){return String(v||"").replace(/\s+/g,"").toLowerCase();}
function cloneSupply(v){return JSON.parse(JSON.stringify(v));}
function checkURL(v){if(!v)return true;try{const u=new URL(v);return (u.protocol==="https:"||u.protocol==="http:")&&!!u.hostname;}catch(e){return /^https?:\/\/[^\s/]+(?:[/?#][^\s]*)?$/.test(v);}}
function validateSupply(input){
 if(!input||input.schemaVersion!==1||!Number.isInteger(input.revision)||input.revision<0)throw Error("备份版本或修订号无效。");
 const db=emptySupply();db.revision=input.revision;
 ["suppliers","factories","links"].forEach(function(kind){
  if(!Array.isArray(input[kind])||input[kind].length>10000)throw Error("档案格式错误或数量超过10000条。");
  const ids=new Set();
  db[kind]=input[kind].map(function(raw){
   if(!raw||typeof raw!=="object")throw Error("档案格式错误。");
   const out={};SUPPLY_FIELDS[kind].forEach(function(key){if(typeof raw[key]!=="string"&&raw[key]!==undefined)throw Error("字段必须为文本："+key);out[key]=String(raw[key]||"").trim();if(out[key].length>8000)throw Error("字段内容过长："+key);});
   if(!/^(SUP|FAC|SFR)-[A-Za-z0-9_-]{3,80}$/.test(out.id)||!out.id.startsWith({suppliers:"SUP-",factories:"FAC-",links:"SFR-"}[kind])||ids.has(out.id))throw Error("档案编号缺失、重复或格式错误。");
   ids.add(out.id);
   if(kind!=="links"){
    if(!out.name||!BUSINESS_IDS.includes(out.businessId)||!PARTY_STATUSES.includes(out.status))throw Error("名称、所属业务或合作状态无效。");
    if(kind==="suppliers"&&!SUPPLIER_TYPES.includes(out.type))throw Error("供应商类型无效。");

 if(type.startsWith("ref:")){

 options=[["","请选择；没有则先建档"],...all.filter(function(r){return r.businessId===business&&(r.status!=="归档"||r.id===value);}).map(function(r){return [r.id,opsLabel(r)+(r.skuId?" · "+opsName("skus",r.skuId):"")];})];
 }

 return '<div class="form-field '+(type==="textarea"||type==="url"?"full":"")+'"><label for="'+id+'">'+esc(f[1])+(required?" *":"")+'</label>'+control+'</div>';
}

 form.onsubmit=async function(e){e.preventDefault();const button=form.querySelector('button[type="submit"]');button.disabled=true;try{capture();const saved=await opsSave(kind,record);document.getElementById("dialog").close();if(OPS_SPEC.map[state.page]?.includes(kind))opsTabs[state.page]=kind;opsRender();showToast("已保存云端记录："+saved.id);}catch(err){document.getElementById("ops-form-error").textContent=cleanError(err);button.disabled=false;}};

async function opsAction(kind,id,action){
 const r=opsData[kind].find(function(x){return x.id===id;});if(!r)return;
 try{
 const base={businessId:r.businessId};
 if(["receive","purchaseReturn","ship","restock"].includes(action)){
 let qty,skuId,wh,supplierId="",factoryId="",a;
 if(action==="receive"||action==="purchaseReturn"){qty=action==="receive"?r.quantity-opsReceived(opsData,id):opsReceived(opsData,id);skuId=r.skuId;wh=r.warehouseId;supplierId=r.supplierId;factoryId=r.factoryId;a=action==="receive"?"采购入库":"采购退货";}
 if(action==="ship"){qty=r.quantity-opsShipped(opsData,id);skuId=r.skuId;wh=r.warehouseId;a="销售出库";}
 if(action==="restock"){const o=opsData.orders.find(function(x){return x.id===r.orderId;});qty=r.quantity-opsReturned(opsData,id);skuId=o.skuId;wh=r.warehouseId;a="退货入库";}
 if(qty<=0)throw Error("没有待处理数量");const sku=opsData.skus.find(function(s){return s.id===skuId;});
 opsEdit("movements",null,{...base,skuId,warehouseId:wh,quantity:qty,unit:sku.unit,sourceId:id,supplierId,factoryId,action:a,status:"草稿"});return;
 }
 if(action==="quote"){opsEdit("quotes",null,{...base,customerId:r.customerId,leadId:r.id,skuId:r.skuId,quantity:r.quantity,unit:r.unit,currency:"USD",status:"草稿"});return;}
 if(action==="toOrder"){opsEdit("orders",null,{...base,customerId:r.customerId,quoteId:r.id,skuId:r.skuId,quantity:r.quantity,unit:r.unit,unitPrice:r.unitPrice,currency:r.currency,status:"正常",paymentStatus:"未收款"});return;}
 if(action==="cash"){opsEdit("payments",null,{...base,name:"订单收款登记："+r.documentNo,direction:"收",category:"销售收款",amount:opsLineTotal(r),currency:r.currency,fx:r.currency==="CNY"?1:"",sourceId:r.id,status:"待核实",notes:"默认金额仅为本订单行产品金额；请按实际到账核实，避免同单多行重复登记整单收款。"});return;}
 if(action==="refund"){opsEdit("payments",null,{...base,name:"售后退款登记："+r.name,direction:"支",category:"客户退款",amount:r.refundAmount||"",currency:r.currency,fx:r.currency==="CNY"?1:"",sourceId:r.id,status:"待核实"});return;}
 if(action==="reverse"){if(!confirm(r.transferId?"将生成新的反向调拨，保留原记录。继续？":"将新增冲销流水，保留原记录。继续？"))return;const next=opsReverse(opsData,opsLiveSupply(),r.id,nowString(),supplyID);opsData=await cloudPersistOps(workspaceStorage,opsData,next);opsRender();showToast("已记录反向操作");return;}
 if(action==="quoteText"){
 const customer=opsName("customers",r.customerId),sku=opsName("skus",r.skuId);
 const text="QUOTATION "+r.documentNo+"\nCustomer: "+customer+"\nProduct / SKU: "+sku+"\nQuantity: "+r.quantity+" "+r.unit+"\nUnit price: "+r.currency+" "+r.unitPrice+"\nProduct subtotal: "+r.currency+" "+opsLineTotal(r).toFixed(2)+"\nFreight allocated to this line: "+(r.freight===""?"To be confirmed":r.currency+" "+r.freight)+"\nTrade terms: "+(r.terms||"To be confirmed")+"\nDestination: "+(r.destination||"To be confirmed")+"\nPayment terms: "+(r.paymentTerms||"To be confirmed")+"\nLead time: "+(r.leadTime||"To be confirmed")+"\nValidity: "+(r.validUntil||"To be confirmed")+"\nStatus: Draft for review; taxes and other charges require confirmation.";
 opsTextDialog("英文报价草稿",text);return;
 }

 }catch(e){showToast(cleanError(e));}

function availableWorkspaceStorage(){
 const memory=new Map();let native;try{native=window.localStorage;}catch{}
 const view={getItem:k=>{try{return native?native.getItem(k):memory.get(k)||null;}catch{return memory.get(k)||null;}},setItem:(k,v)=>{try{if(native)native.setItem(k,v);else memory.set(k,v);}catch{memory.set(k,v);}},removeItem:k=>{try{if(native)native.removeItem(k);else memory.delete(k);}catch{memory.delete(k);}}};
 return {getItem:function(k){if(k==="opc.supply.v1")return JSON.stringify(window.OPC_CLOUD.supply);if(k==="opc.operations.v1")return JSON.stringify(window.OPC_CLOUD.operations);return view.getItem(k);},
 setItem:function(k,v){if(k==="opc.supply.v1"||k==="opc.operations.v1")throw Error("云端写入需等待服务器确认");return view.setItem(k,v);},
 removeItem:function(k){if(k==="opc.supply.v1"||k==="opc.operations.v1")throw Error("不能删除云端业务数据");return view.removeItem(k);},
 commitBoth:async function(srev,orev,supply,operations){if(srev!==window.OPC_CLOUD.supply.revision||orev!==window.OPC_CLOUD.operations.revision)throw Error("档案已更新，请刷新");await cloudWrite(supply,operations);},
 rawBackup:()=>JSON.stringify({format:"opc.workspace.backup",version:1,supply:window.OPC_CLOUD.supply,operations:window.OPC_CLOUD.operations})};
}
async function cloudPersistSupply(storage,before,next){if(before.revision!==window.OPC_CLOUD.supply.revision)throw Error("供应链已更新，请刷新");return (await cloudWrite(next,window.OPC_CLOUD.operations)).supply;}
async function cloudPersistOps(storage,before,next){if(before.revision!==window.OPC_CLOUD.operations.revision)throw Error("业务记录已更新，请刷新");return (await cloudWrite(window.OPC_CLOUD.supply,next)).operations;}
async function cloudWrite(supply,operations){
 if(window.OPC_CLOUD_BUSY)throw Error("上一笔保存尚未完成，请稍后重试");
 window.OPC_CLOUD_BUSY=true;cloudStatus("正在保存到云端…");
 try{
 const requestId=crypto.randomUUID();
 const r=await fetch("/api/workspace",{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({requestId,expectedRevision:window.OPC_CLOUD.revision,supply,operations})});
 const result=await r.json();if(!r.ok)throw Error(result.error||"云端保存失败");
 window.OPC_CLOUD=result;cloudApply(result);cloudStatus("已保存到云端");return result;
 }catch(e){cloudStatus("保存失败；表单内容保留");throw e;}finally{window.OPC_CLOUD_BUSY=false;}
}
function cloudApply(snapshot){window.OPC_CLOUD=snapshot;supplyData=validateSupply(snapshot.supply);opsData=opsValidate(snapshot.operations,supplyData);}
function cloudStatus(text){const el=document.getElementById("cloud-status");if(el)el.textContent=text;}
async function cloudRefresh(manual){
 if(window.OPC_CLOUD_BUSY||document.getElementById("dialog")?.open)return;
 try{const r=await fetch("/api/workspace?since="+window.OPC_CLOUD.revision,{credentials:"same-origin",cache:"no-store"});if(r.status===304){if(manual)cloudStatus("已是最新数据");return;}const value=await r.json();if(!r.ok)throw Error(value.error||"同步失败");cloudApply(value);shell();cloudStatus("已读取其他设备更新");}
 catch(e){cloudStatus(e.message);if(manual)showToast(e.message);}
}
const cloudOriginalShell=shell;
shell=function(){
 cloudOriginalShell();
 document.querySelectorAll('a[href^="#gid="]').forEach(function(a){a.remove();});
 const header=document.querySelector(".top-right");
 if(header){header.innerHTML='<span id="cloud-status" role="status">云端已连接</span><button class="btn" id="cloud-refresh">同步</button><button class="btn" id="cloud-signout">退出</button>';
 document.getElementById("cloud-refresh").onclick=()=>cloudRefresh(true);
 document.getElementById("cloud-signout").onclick=async()=>{if(window.OPC_CLOUD_BUSY)return;try{const r=await fetch("/api/logout",{method:"POST",headers:{"content-type":"application/json"},body:"{}"});if(!r.ok)throw Error("退出失败");location.href="/login";}catch(e){showToast(e.message);}};}
 const footer=document.querySelector("footer");if(footer)footer.innerHTML='OPC CLOUD · v0.4.1 <span>登录后云端保存 · 另一设备更新可点击同步</span>';
};

new MutationObserver(()=>{
 document.querySelectorAll('table.supply-table').forEach(table=>{
 const labels=Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent);
 table.querySelectorAll('tbody tr').forEach(tr=>Array.from(tr.children).forEach((td,i)=>td.setAttribute('data-label',labels[i]||'')));
 });
}).observe(document.getElementById('app'),{childList:true,subtree:true});
setInterval(()=>{if(document.visibilityState==="visible")cloudRefresh(false);},15000);
window.addEventListener("focus",()=>cloudRefresh(false));
shell();

</script>
