<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录 · OPC工作台</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f2;color:#18372c;font:15px/1.6 system-ui,sans-serif;padding:20px}.box{max-width:420px;width:100%;padding:32px;background:white;border:1px solid #dbe5df;border-radius:16px}h1{font-size:25px;margin:5px 0}p{color:#718176;font-size:13px}.label{letter-spacing:2px;color:#18745c;font-size:11px}label{display:block;font-size:13px;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd9d0;border-radius:7px;font:16px system-ui}button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:7px;background:#17755d;color:white;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#error{color:#aa4034;font-size:13px}small{color:#8b9890;font-size:11px}</style><meta name="theme-color" content="#173436"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPC工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/mobile.css">
<script src="/mobile.js" defer></script>
</head><body><main class="box"><div class="label">OPC CLOUD WORKSPACE</div><h1>登录你的工作台</h1><p>电脑与手机使用同一工作台账号，访问云端任务和业务资料。</p><form id="login"><label for="login-name">工作台账号</label><input id="login-name" name="login" autocomplete="username" required maxlength="200"><label for="login-password">工作台密码</label><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="512"><p id="error" role="alert"></p><button type="submit">登录</button></form><p><small>使用部署时设置的ADMIN_LOGIN和ADMIN_PASSWORD；这是独立的工作台登录，不会自动使用Render后台账号。</small></p></main><script>document.getElementById('login').onsubmit=async function(e){e.preventDefault();const b=this.querySelector('button'),error=document.getElementById('error');b.disabled=true;error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({login:this.elements.login.value,password:this.elements.password.value})});const data=await r.json();if(!r.ok)throw Error(data.error||'登录失败');location.href='/';}catch(e){error.textContent=e.message;b.disabled=false;}};</script></body></html>
